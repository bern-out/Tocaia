[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tocaia"
version = "0.1.0"
description = "Subdomain discovery and scanning automation for authorized recon workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "bern-out", email = "ander2017@proton.me" }
]
dependencies = [
  "urllib3>=2.0"
]
keywords = ["recon", "subdomain", "bug-bounty", "security", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Utilities"
]

[project.scripts]
tocaia = "tocaia:main"

[tool.setuptools]
py-modules = ["tocaia", "custom_logging"]
